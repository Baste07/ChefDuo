<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChefDuo | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== SPLASH / INTRO SCREEN ===== -->
<div class="splash-screen" id="splashScreen">
  <div class="splash-content">
    <p class="splash-eyebrow">Good Food, Good Mood</p>
    <h1 class="splash-title">ChefDuo</h1>
  </div>
</div>

<!-- ===== HEADER ===== -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">

    <a href="home.html" class="logo-link" aria-label="ChefDuo home">
      <img src="src/logo.jpg" alt="ChefDuo logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-fallback" aria-hidden="true">Chef<span class="logo-accent">Duo</span></span>
    </a>

    <nav class="main-nav" id="mainNav">
      <ul class="nav-list"> 
        <li><a href="home.html" class="nav-link active">Home</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="menu.html" class="nav-link">Our Menu</a></li>
        <li><a href="reviews.html" class="nav-link">Reviews</a></li>
        <li>
          <a href="https://www.facebook.com/chefduo.bagumbayan" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12Z"/></svg>
          </a>
        </li>
      </ul>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mainNav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<!-- ===== PAGE CONTENT ===== -->
<main>
  <section id="home" class="hero-section">
    <div class="hero-inner">

      <div class="hero-content">
        <p class="hero-eyebrow">Good Food, Good Mood</p>
        <h1 class="hero-title">ChefDuo</h1>
        <p class="hero-tagline">Elevating everyday dining with fresh, bold, and expertly crafted meals — crafted by two, perfected together.</p>
        <div class="hero-actions">
          <a href="menu.html" class="btn btn-primary">Explore Our Menu</a>
          <a href="https://www.google.com/maps/place/Chef+Duo/@14.6083242,121.0809848,17.42z/data=!4m6!3m5!1s0x3397b90037289e43:0x2a6373c41c4ba2fb!8m2!3d14.6090107!4d121.0823167!16s%2Fg%2F11y8ffz5d0?entry=ttu&g_ep=EgoyMDI2MDcxMi4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Find Our Store</a>
        </div>
      </div>

      <div class="hero-carousel" id="heroCarousel">
        <div class="carousel-viewport">
          <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide">
              <img src="src/photo2.jpg" alt="ChefDuo dish 1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" draggable="false">
              <div class="slide-fallback" aria-hidden="true">Photo 1</div>
            </div>
            <div class="carousel-slide">
              <img src="src/photo3.jpg" alt="ChefDuo dish 2" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" draggable="false">
              <div class="slide-fallback" aria-hidden="true">Photo 2</div>
            </div>
            <div class="carousel-slide">
              <img src="src/photo1.jpg" alt="ChefDuo dish 3" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" draggable="false">
              <div class="slide-fallback" aria-hidden="true">Photo 3</div>
            </div>
            <div class="carousel-slide">
              <img src="src/photo4.jpg" alt="ChefDuo dish 4" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" draggable="false">
              <div class="slide-fallback" aria-hidden="true">Photo 4</div>
            </div>
            <div class="carousel-slide">
              <img src="src/photo5.jpg" alt="ChefDuo dish 5" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" draggable="false">
              <div class="slide-fallback" aria-hidden="true">Photo 5</div>
            </div>
          </div>
        </div>

        <div class="carousel-dots" id="carouselDots" role="tablist" aria-label="Choose photo"></div>
      </div>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="script.js"></script>
</body>
</html>
